services:

  mongo:
    image: mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: owolabigrace/todo-api:latest
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      MONGO_URL: mongodb://mongo:27017/todos

    depends_on:
      mongo:
        condition: service_healthy


volumes:
  mongo-data: